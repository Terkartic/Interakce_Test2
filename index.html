<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest Prototyp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigace -->
  <header class="navbar">
    <div class="logo">📌 Prototyp</div>
    <input type="text" id="search-input" placeholder="Hledat nápad..." class="search-bar">
    
    <div class="tabs">
      <button id="tab-all" class="tab-btn active">Všechny</button>
      <button id="tab-saved" class="tab-btn">Uložené</button>
    </div>
  </header>

  <!-- Hlavní nástěnka -->
  <main class="grid" id="pin-container"></main>

  <script src="script.js"></script>
</body>
</html>
